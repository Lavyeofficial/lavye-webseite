<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAVYÉ — Coming Soon</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 42%, #fffdf9 0%, #f8f1e8 48%, #eee2d4 100%);
  font-family: Georgia, "Times New Roman", serif;
  color: #5f5148;
}

.hero {
  text-align: center;
  padding: 40px 20px;
}

.logo {
  font-size: clamp(52px, 12vw, 100px);
  font-weight: 400;
  letter-spacing: 0.08em;
  margin: 0;
}

.accent {
  width: 90px;
  height: 1px;
  background: #bba995;
  margin: 24px auto 28px;
  opacity: 0.7;
}

.coming {
  font-size: clamp(15px, 3.5vw, 20px);
  letter-spacing: 0.38em;
  text-transform: uppercase;
  margin-left: 0.38em;
  opacity: 0;
  animation: appear 4s ease forwards;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(12px);
    letter-spacing: 0.55em;
  }
  to {
    opacity: 0.8;
    transform: translateY(0);
    letter-spacing: 0.38em;
  }
}
</style>
</head>

<body>
  <main class="hero">
    <h1 class="logo">LAVYÉ</h1>
    <div class="accent"></div>
    <div class="coming">Coming Soon</div>
  </main>
</body>
</html>
